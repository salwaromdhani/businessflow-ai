<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inscription | BusinessFlow AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=Manrope:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>
  <body>
    <main class="auth-page">
      <div class="auth-brand">
        <a class="brand" href="../index.html"
          ><span class="brand-mark">↗</span>BusinessFlow
          <span class="gradient-text">AI</span></a
        >
      </div>
      <section class="auth-card card">
        <span class="eyebrow">Votre espace commence ici</span>
        <h1>Creer votre compte</h1>
        <p class="muted">Créez un espace tunisien de démonstration. Le premier compte reçoit le rôle Admin.</p>
        <div id="auth-message" aria-live="polite"></div>
        <form id="register-form" novalidate>
          <div class="form-grid">
            <div class="form-field">
              <label for="first-name">Prenom</label
              ><input
                id="first-name"
                name="firstName"
                placeholder="Amel"
                required
              />
            </div>
            <div class="form-field">
              <label for="last-name">Nom</label
              ><input
                id="last-name"
                name="lastName"
                placeholder="Ben Youssef"
                required
              />
            </div>
          </div>
          <div class="form-field">
            <label for="company">Entreprise</label
            ><input
              id="company"
              name="company"
              placeholder="Carthage Digital"
              required
            />
          </div>
          <div class="form-field">
            <label for="email">Adresse e-mail</label
            ><input
              id="email"
              name="email"
              type="email"
              placeholder="vous@entreprise.tn"
              required
            />
          </div>
          <div class="form-grid">
            <div class="form-field">
              <label for="password">Mot de passe</label
              ><input
                id="password"
                name="password"
                type="password"
                minlength="8"
                placeholder="8 caracteres minimum"
                required
              />
            </div>
            <div class="form-field">
              <label for="confirm-password">Confirmation</label
              ><input
                id="confirm-password"
                name="confirmPassword"
                type="password"
                placeholder="Retapez le mot de passe"
                required
              />
            </div>
          </div>
          <button class="btn btn-primary full" type="submit">
            Creer mon compte <span>→</span>
          </button>
        </form>
        <p class="auth-switch">
          Deja inscrit ? <a href="login.html">Se connecter</a>
        </p>
      </section>
      <p class="auth-note">
        Interface de demonstration · aucune donnee reelle n'est envoyee.
      </p>
    </main>
    <script src="../js/i18n/fr.js"></script><script src="../js/i18n/en.js"></script><script src="../js/i18n/ar.js"></script>
    <script src="../js/storage.js"></script><script src="../js/auth-service.js"></script><script src="../js/main.js"></script>
    <script src="../js/auth.js"></script>
  </body>
</html>
