<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Entreprises | BusinessFlow AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=Manrope:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar"></aside>
      <div class="app-content">
        <header class="app-header">
          <div style="display: flex; align-items: center">
            <button
              class="mobile-sidebar-toggle"
              aria-label="Ouvrir la navigation"
            >
              ☰
            </button>
            <div>
              <p class="eyebrow" style="margin: 0 0 4px">Organisation</p>
              <h1>Entreprises</h1>
            </div>
          </div>
          <div class="header-user">
            <div class="avatar">CM</div>
            <strong class="user-copy">Clara Martin</strong>
          </div>
        </header>
        <main class="page-content">
          <div
            style="
              display: flex;
              justify-content: space-between;
              align-items: end;
              gap: 18px;
              flex-wrap: wrap;
              margin-bottom: 24px;
            "
          >
            <p class="muted" style="margin: 0">
              Gerez vos espaces de travail et entites de demonstration.
            </p>
            <button class="btn btn-primary" id="new-company" data-permission="manageMembers">
              + Ajouter une entreprise
            </button>
          </div>
          <div id="company-message" aria-live="polite"></div>
          <section class="card panel">
            <div class="panel-heading">
              <h2>Espaces de travail</h2>
              <input
                id="company-search"
                placeholder="Rechercher..."
                style="
                  padding: 8px 10px;
                  border: 1px solid var(--line);
                  border-radius: 8px;
                "
              />
            </div>
            <div class="table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Entreprise</th>
                    <th>Secteur</th>
                    <th>Membres</th>
                    <th>Statut</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="company-list"></tbody>
              </table>
            </div>
          </section>
        </main>
      </div>
    </div>
    <script src="../js/i18n/fr.js"></script><script src="../js/i18n/en.js"></script><script src="../js/i18n/ar.js"></script><script src="../js/storage.js"></script><script src="../js/auth-service.js"></script><script src="../js/main.js"></script>
    <script src="../js/companies.js"></script>
  </body>
</html>
